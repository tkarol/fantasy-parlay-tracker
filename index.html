<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Run a weekly group parlay with your friends. One ticket, one leg each, live odds, and season-long bragging rights."
    />
    <meta property="og:title" content="Fantasy Parlay Tracker" />
    <meta
      property="og:description"
      content="One ticket. One leg each. Season-long bragging rights."
    />
    <meta property="og:type" content="website" />
    <title>Fantasy Parlay Tracker</title>
    <script>
      // Apply the stored theme before first paint so there is no light flash.
      (function () {
        try {
          var stored = localStorage.getItem("parlay-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* storage blocked — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Self-heal a stale page.
      //
      // A browser holding an old index.html asks for asset filenames that the
      // latest deploy no longer has. Hosting's SPA rewrite answers those with
      // index.html itself, so the module fails its MIME check, never runs, and
      // the page is blank forever — which is how this looked on a phone while
      // a desktop that happened to revalidate was fine.
      //
      // Caching is fixed above this, but a client already holding the stale
      // copy cannot benefit from that until it fetches the page again. So:
      // reload once, and only once, so a genuinely broken script cannot put
      // the page in a loop.
      window.addEventListener(
        "error",
        function (event) {
          var el = event.target;
          if (!el || el.tagName !== "SCRIPT" || !el.src) return;
          try {
            if (sessionStorage.getItem("stale-asset-reload")) return;
            sessionStorage.setItem("stale-asset-reload", "1");
          } catch (e) {
            return; // storage blocked; a reload loop would be worse than a blank page
          }
          window.location.reload();
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
